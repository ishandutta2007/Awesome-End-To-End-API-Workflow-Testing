<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.25" />
    </pattern>

    <!-- Pulsing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Keyframe Animations -->
    <style>
      @keyframes flowDash {
        from { stroke-dashoffset: 40; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes floatPill {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      @keyframes scanline {
        0% { transform: translateY(-100px); opacity: 0; }
        50% { opacity: 0.15; }
        100% { transform: translateY(450px); opacity: 0; }
      }

      .flow-line {
        stroke-dasharray: 8 6;
        animation: flowDash 2.5s linear infinite;
      }
      .flow-line-reverse {
        stroke-dasharray: 8 6;
        animation: flowDash 2.5s linear infinite reverse;
      }
      .glow-orb-1 {
        transform-origin: 200px 100px;
        animation: pulseGlow 7s ease-in-out infinite;
      }
      .glow-orb-2 {
        transform-origin: 1000px 320px;
        animation: pulseGlow 8s ease-in-out infinite 1s;
      }
      .pill-1 { animation: floatPill 4s ease-in-out infinite; }
      .pill-2 { animation: floatPill 4.5s ease-in-out infinite 0.7s; }
      .pill-3 { animation: floatPill 5s ease-in-out infinite 1.4s; }
      .pill-4 { animation: floatPill 4.2s ease-in-out infinite 2.1s; }
    </style>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Technical Grid Overlay -->
  <rect width="1200" height="420" rx="16" fill="url(#gridPattern)" />

  <!-- Ambient Dynamic Glowing Orbs (Background) -->
  <circle class="glow-orb-1" cx="200" cy="100" r="140" fill="#38bdf8" opacity="0.2" filter="url(#glow)" />
  <circle class="glow-orb-2" cx="1000" cy="320" r="160" fill="#818cf8" opacity="0.2" filter="url(#glow)" />

  <!-- Dynamic Animated Workflow Graph (Underlay & Accents) -->
  <g opacity="0.75">
    <!-- Connecting Workflow Paths -->
    <path class="flow-line" d="M 120 330 C 260 330, 280 350, 420 350" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <path class="flow-line" d="M 420 350 C 560 350, 640 330, 780 330" fill="none" stroke="#818cf8" stroke-width="2.5" />
    <path class="flow-line" d="M 780 330 C 920 330, 960 350, 1080 350" fill="none" stroke="#c084fc" stroke-width="2.5" />
    <path class="flow-line-reverse" d="M 1080 350 C 960 380, 800 380, 600 380 C 400 380, 240 360, 120 330" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.4" />

    <!-- Node 1: Auth / Token -->
    <g transform="translate(120, 330)">
      <circle r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" filter="url(#nodeGlow)" />
      <circle r="6" fill="#38bdf8" />
      <text x="0" y="28" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">AUTH / JWT</text>
    </g>

    <!-- Node 2: Multi-step Orchestration -->
    <g transform="translate(420, 350)">
      <circle r="16" fill="#0f172a" stroke="#818cf8" stroke-width="2.5" filter="url(#nodeGlow)" />
      <circle r="6" fill="#818cf8" />
      <text x="0" y="28" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">PIPELINE CHAIN</text>
    </g>

    <!-- Node 3: State & DB Assertions -->
    <g transform="translate(780, 330)">
      <circle r="16" fill="#0f172a" stroke="#a855f7" stroke-width="2.5" filter="url(#nodeGlow)" />
      <circle r="6" fill="#a855f7" />
      <text x="0" y="28" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">ASSERT &amp; MOCK</text>
    </g>

    <!-- Node 4: CI/CD Verification -->
    <g transform="translate(1080, 350)">
      <circle r="16" fill="#0f172a" stroke="#34d399" stroke-width="2.5" filter="url(#nodeGlow)" />
      <circle r="6" fill="#34d399" />
      <text x="0" y="28" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">CI/CD PASS</text>
    </g>
  </g>

  <!-- Foreground Title and Branding (Guaranteed Clear & Legible) -->
  <g transform="translate(600, 110)">
    <!-- Small Category Pill -->
    <rect x="-140" y="-45" width="280" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <text x="0" y="-27" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle">API QUALITY &amp; ORCHESTRATION</text>

    <!-- Main Title -->
    <text x="0" y="32" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" text-anchor="middle">
      Awesome End-To-End API
    </text>
    <text x="0" y="78" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" text-anchor="middle">
      Workflow Testing
    </text>

    <!-- Subtitle -->
    <text x="0" y="122" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" letter-spacing="0.3" text-anchor="middle">
      Curated ecosystem of SaaS platforms &amp; open-source projects for multi-step API automation &amp; CI/CD
    </text>
  </g>

  <!-- Floating Feature Badges / Pills (Animated, Positioned Above the Graph) -->
  <g class="pill-1" transform="translate(160, 230)">
    <rect x="-80" y="-15" width="160" height="30" rx="15" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    <text x="0" y="5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ Multi-Step Chains</text>
  </g>

  <g class="pill-2" transform="translate(450, 230)">
    <rect x="-80" y="-15" width="160" height="30" rx="15" fill="#1e293b" fill-opacity="0.9" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5" />
    <text x="0" y="5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🔄 State Carryover</text>
  </g>

  <g class="pill-3" transform="translate(750, 230)">
    <rect x="-80" y="-15" width="160" height="30" rx="15" fill="#1e293b" fill-opacity="0.9" stroke="#a855f7" stroke-width="1" stroke-opacity="0.5" />
    <text x="0" y="5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🛡️ Contract &amp; Mocks</text>
  </g>

  <g class="pill-4" transform="translate(1040, 230)">
    <rect x="-80" y="-15" width="160" height="30" rx="15" fill="#1e293b" fill-opacity="0.9" stroke="#34d399" stroke-width="1" stroke-opacity="0.5" />
    <text x="0" y="5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🚀 CI/CD Automation</text>
  </g>
</svg>
